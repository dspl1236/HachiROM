name: Build HachiROM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build EXE
        run: python build.py

      - name: Read version
        id: ver
        shell: python
        run: |
          import os
          name = open("dist/exe_name.txt").read().strip()
          ver = name.replace("HachiROM-v","").replace(".exe","")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={ver}\n")
              f.write(f"exe_name={name}\n")

      - name: Delete existing latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create latest release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "HachiROM v${{ steps.ver.outputs.version }} — Latest Build" \
            --notes "## HachiROM v${{ steps.ver.outputs.version }}

          **Hitachi MMS ECU ROM Editor — Audi 5-cylinder 20v / V6**

          Download \`${{ steps.ver.outputs.exe_name }}\` and run — no install needed.

          ### Supported ECUs
          - **893 906 266D** — 7A 2.3L 20v (late, 4-connector Hitachi)
          - **893 906 266B** — 7A 2.3L 20v (early, 2-connector Hitachi)
          - **4A0 906 266** — AAH 2.6L 12v V6

          ### Features
          - 16×16 fuel and ignition map editors with heatmap visualization
          - Full calibration table editing (warmup, IAT, MAF linearization, etc.)
          - CO potentiometer disable patch
          - Big MAF axis patch (7A)
          - AAH V6 MAF axis patch
          - Checksum correction (mod256, all supported variants)
          - ROM diff / compare tool
          - Save as 32KB or 64KB mirrored .bin

          ---
          *⚠ Work in progress — always back up your original ROM before editing.*" \
            "dist/${{ steps.ver.outputs.exe_name }}"
